name: Set up Runnelix
description: Install the manifest-pinned toolchain and dependencies on Ubuntu.
inputs:
  postgres:
    description: Install PostgreSQL 16 tools for isolated database tests.
    default: 'false'
  temporal:
    description: Install the checksum-pinned Temporal CLI for runtime tests.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Reads packageManager from package.json; do not duplicate its version here.
      with:
        run_install: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Install PostgreSQL tools
      if: inputs.postgres == 'true'
      shell: bash
      run: |
        if [[ ! -x /usr/lib/postgresql/16/bin/initdb ]]; then
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-16
        fi
        echo 'RUNNELIX_PG_BIN=/usr/lib/postgresql/16/bin' >> "$GITHUB_ENV"
    - name: Install locked dependencies
      shell: bash
      run: make deps
    - name: Install verified Temporal CLI
      if: inputs.temporal == 'true'
      shell: bash
      run: make tools
